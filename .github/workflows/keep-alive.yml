# Keeps the free Supabase project awake: Supabase pauses free projects after
# 7 days with no activity (e.g. international breaks, summer). Every 3 days this
# makes one tiny database call using the PUBLIC key already in docs/config.js.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # 06:17 UTC every 3 days
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  actions: write              # to keep this schedule switched on (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(sed -n 's/.*SUPABASE_URL = "\(.*\)".*/\1/p' docs/config.js)
          KEY=$(sed -n 's/.*SUPABASE_KEY = "\(.*\)".*/\1/p' docs/config.js)
          if [[ "$URL" == *YOUR-PROJECT-REF* || -z "$KEY" || "$KEY" == YOUR-* ]]; then
            echo "docs/config.js still has placeholders - nothing to ping yet."
            exit 0
          fi
          # A harmless public function: returns next Friday's 5pm deadline
          curl -fsS -X POST "$URL/rest/v1/rpc/next_friday_deadline" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
          echo "Supabase is awake."

      # GitHub switches off scheduled jobs in repos with no commits for 60 days.
      # Re-enabling this workflow each run keeps the schedule going over summer.
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
