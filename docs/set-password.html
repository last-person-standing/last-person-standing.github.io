<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Set your password · Last Person Standing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <div class="stripe"></div>
    <h1 data-game-name>Last Person Standing</h1>

    <p class="msg" id="status" role="status">Checking your link…</p>

    <form id="pw-form" class="card" novalidate hidden>
      <h2>Set your password</h2>
      <label>Your name (shown to other players)
        <input type="text" name="name" autocomplete="name" maxlength="60" required>
      </label>
      <label>New password (at least 8 characters)
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Type it again
        <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit" class="full">Save and continue</button>
      <p class="msg" role="status"></p>
    </form>

    <p id="back" hidden><a href="index.html">Go to the log in page</a></p>
  </main>
  <a class="vopria-badge" href="https://vopria.com" target="_blank" rel="noopener" title="Built by Vopria"><img src="img/vopria-mark.svg" alt=""><span>Built by <strong>Vopria</strong></span></a>

  <script type="module">
    import { sb, $, say } from "./js/app.js";

    const status = $("#status");
    const form = $("#pw-form");

    // Supabase puts any link problem (e.g. expired) in the address after "#"
    const hash = new URLSearchParams(location.hash.slice(1));
    if (hash.get("error")) {
      say(status, hash.get("error_code") === "otp_expired"
        ? "This link has expired or was already used. Confirming a new account? Try logging in. If it asks you to confirm, tap \"Resend confirmation email\". Resetting your password? Use \"Forgot password\" for a new link."
        : `This link didn't work: ${hash.get("error_description") || hash.get("error")}`, "error");
      $("#back").hidden = false;
    } else {
      // The client reads the login token from the link automatically
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        say(status, "This page needs the link from your invite or reset email. Open the email and tap the link again.", "error");
        $("#back").hidden = false;
      } else {
        say(status, "");
        const { data: profile } = await sb
          .from("profiles").select("display_name").eq("id", session.user.id).single();
        form.name.value = profile?.display_name ?? "";
        form.hidden = false;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = $(".msg", form);
      const name = form.name.value.trim();
      const pw = form.password.value;
      if (!name) return say(msg, "Please enter your name.", "error");
      if (pw.length < 8) return say(msg, "Password must be at least 8 characters.", "error");
      if (pw !== form.confirm.value) return say(msg, "The two passwords don't match.", "error");

      const btn = $("button[type=submit]", form);
      btn.disabled = true; say(msg, "Saving…");
      const { data: { user } } = await sb.auth.getUser();
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        btn.disabled = false;
        return say(msg, /different|same/i.test(error.message)
          ? "Please choose a different password from your old one."
          : error.message, "error");
      }
      await sb.from("profiles").update({ display_name: name }).eq("id", user.id);
      location.replace("pick.html");
    });
  </script>
</body>
</html>
